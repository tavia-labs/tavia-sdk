<!doctype html>
<meta charset="utf-8">
<title>Talk to the agent</title>
<button id="talk">Start talking</button>
<pre id="log"></pre>
<script type="module">
  // In a bundled app: import { Tavia, LIMITS, createPlayer, openMic } from '@tavia/sdk'
  import { Tavia, LIMITS, createPlayer, openMic } from 'https://cdn.jsdelivr.net/npm/@tavia/sdk@0.9.0/index.js'

  const log = (line) => { document.querySelector('#log').textContent += `${line}\n` }

  async function start() {
    const { token, url } = await (await fetch('/token', { method: 'POST' })).json()
    const tavia = new Tavia({ token, urls: { realtime: url } })
    const player = createPlayer(LIMITS['realtime.outputRates'][0])
    const call = await tavia.realtime.connect({
      player,
      session: { voice: 'elaine', instructions: 'You are a friendly front desk. Keep answers short.' },
    })
    call.on('transcript', (t) => { if (t.final) log(`${t.role}: ${t.text}`) })
    call.onError((err) => log(`error: ${err.code} ${err.message}`))
    const mic = await openMic({ sampleRate: LIMITS['realtime.inputRates'][0] })
    mic.onFrame((pcm) => call.sendAudio(pcm))
    call.onClose(() => { mic.stop(); void player.close() })
  }

  document.querySelector('#talk').addEventListener('click', () => { start().catch((err) => log(String(err))) }, { once: true })
</script>
