[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tavia"
version = "0.9.0"
description = "Tavia realtime voice agents, speech-to-text and text-to-speech for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["websockets>=13", "httpx>=0.27"]
keywords = ["tavia", "voice", "voice-agent", "realtime", "speech-to-text", "text-to-speech", "websocket", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://tavialabs.com"
Documentation = "https://app.tavialabs.com/docs"
Repository = "https://github.com/tavia-labs/tavia-sdk"
Issues = "https://github.com/tavia-labs/tavia-sdk/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
include = ["tavia*"]

[tool.setuptools.package-data]
tavia = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tavia/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tavia"]
